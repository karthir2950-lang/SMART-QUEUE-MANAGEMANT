name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: smart-queue/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: smart-queue/frontend

      - name: Build frontend
        run: npm run build
        working-directory: smart-queue/frontend
        env:
          VITE_BASE_PATH: '/SMART-QUEUE-MANAGEMANT/'

      - name: Copy 404.html for SPA fallback
        run: cp 404.html smart-queue/frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'smart-queue/frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
